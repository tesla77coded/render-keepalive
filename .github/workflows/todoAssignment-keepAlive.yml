name: TodoBackend - Login then GET /api/v1/tasks (Keepalive)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keepalive-login-gettasks:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://todobackendassignment-wy0n.onrender.com
      LOGIN_PATH: /api/v1/users/login
      TASKS_PATH: /api/v1/tasks
      EMAIL: ${{ secrets.TODO_KEEPALIVE_EMAIL }}
      PASSWORD: ${{ secrets.TODO_KEEPALIVE_PASSWORD }}
    steps:
      - name: 'Keepalive: login + get tasks (with retries)'
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_URL="${BASE_URL}${LOGIN_PATH}"
          TASKS_URL="${BASE_URL}${TASKS_PATH}?archived=false"

          echo "Login URL: $LOGIN_URL"
          echo "Tasks URL: $TASKS_URL"

          printf '%s' "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" > /tmp/login_payload.json

          # A more robust, recursive helper to find the token
          extract_token() {
            python3 - <<'PY' || return 1
          import sys, json
          try:
              data = json.load(sys.stdin)
          except json.JSONDecodeError:
              sys.exit(1)

          def find_token_recursively(obj):
              # Case 1: If it's a dictionary, check for common token keys
              if isinstance(obj, dict):
                  for key in ("token", "jwt", "accessToken", "access_token", "access", "authToken", "Token"):
                      value = obj.get(key)
                      if isinstance(value, str) and value.strip():
                          return value.strip()
                  # If not found, recurse into the dictionary's values
                  for value in obj.values():
                      token = find_token_recursively(value)
                      if token:
                          return token
              # Case 2: If it's a list, recurse into its items
              elif isinstance(obj, list):
                  for item in obj:
                      token = find_token_recursively(item)
                      if token:
                          return token
              # Case 3: Fallback for a string that looks like a JWT
              elif isinstance(obj, str) and obj.count('.') >= 2:
                  return obj
              return None

          token = find_token_recursively(data)
          if token:
              print(token)
              sys.exit(0)
          else:
              sys.exit(1)
          PY
          }

          login_resp_file="/tmp/login_resp.json"
          token=""

          # 1) Login with retries
          for i in 1 2 3; do
            echo "Login attempt $i..."
            http_code=$(curl -sS --max-time 20 -w "%{http_code}" -o "${login_resp_file}" -X POST "${LOGIN_URL}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/login_payload.json || true)
            echo "Login HTTP $http_code"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              if token=$(cat "${login_resp_file}" | extract_token); then
                echo "Login success; token extracted."
                break
              else
                echo "Login returned 2xx but token not found. Response snippet:"
                head -c 500 "${login_resp_file}" || true
                exit 1
              fi
            fi
            sleep 4
          done

          if [ -z "${token:-}" ]; then
            echo "Failed to login and extract token after retries."
            head -c 500 "${login_resp_file}" || true
            exit 1
          fi

          # 2) GET /tasks with retries
          tasks_resp_file="/tmp/tasks_resp.json"
          for i in 1 2 3; do
            echo "GET /tasks attempt $i..."
            http_code=$(curl -sS --max-time 20 -w "%{http_code}" -o "${tasks_resp_file}" -X GET "${TASKS_URL}" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${token}" || true)
            echo "Tasks HTTP $http_code"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Tasks fetch success (HTTP $http_code)."
              exit 0
            fi
            sleep 4
          done

          echo "Failed to fetch tasks after retries."
          exit 1
