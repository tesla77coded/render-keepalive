name: TodoBackend - Login then GET /api/v1/tasks (Keepalive)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keepalive-login-gettasks:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://todobackendassignment-wy0n.onrender.com
      LOGIN_PATH: /api/v1/users/login
      TASKS_PATH: /api/v1/tasks
      EMAIL: ${{ secrets.TODO_KEEPALIVE_EMAIL }}
      PASSWORD: ${{ secrets.TODO_KEEPALIVE_PASSWORD }}
    steps:
      - name: 'Keepalive: login + get tasks (with retries)'
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_URL="${BASE_URL}${LOGIN_PATH}"
          TASKS_URL="${BASE_URL}${TASKS_PATH}?archived=false"

          echo "Login URL: $LOGIN_URL"
          echo "Tasks URL: $TASKS_URL"

          # write login JSON to a temp file (avoids YAML/quote issues)
          printf '%s' "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" > /tmp/login_payload.json

          # helper: try extract token from JSON body (jq if available, else python)
          extract_token_from_body() {
            if command -v jq >/dev/null 2>&1; then
              # Try common fields using jq; will output raw string without quotes if present
              for key in token jwt accessToken access_token access authToken; do
                val=$(jq -r "if .${key} then .${key} else empty end" 2>/dev/null || true)
                if [ -n "$val" ] && [ "$val" != "null" ]; then
                  printf '%s' "$val"
                  return 0
                fi
              done
              # nested containers
              for nested in data user auth; do
                for key in token jwt accessToken access_token; do
                  val=$(jq -r "if .${nested}.${key} then .${nested}.${key} else empty end" 2>/dev/null || true)
                  if [ -n "$val" ] && [ "$val" != "null" ]; then
                    printf '%s' "$val"
                    return 0
                  fi
                done
              done
              # last resort: find any string with two dots (JWT-like)
              val=$(jq -r '.. | strings | select(test("\\."))' 2>/dev/null | head -n1 || true)
              if [ -n "$val" ]; then
                printf '%s' "$val"
                return 0
              fi
              return 1
            else
              # fallback to python-based extractor
              python3 - <<'PY' || return 1
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          def find_token_recursively(obj):
              if isinstance(obj, dict):
                  for key in ("token", "jwt", "accessToken", "access_token", "access", "authToken"):
                      value = obj.get(key)
                      if isinstance(value, str) and value.strip():
                          return value.strip()
                  for value in obj.values():
                      token = find_token_recursively(value)
                      if token:
                          return token
              elif isinstance(obj, list):
                  for item in obj:
                      token = find_token_recursively(item)
                      if token:
                          return token
              elif isinstance(obj, str) and obj.count('.') >= 2:
                  return obj
              return None
          token = find_token_recursively(data)
          if token:
              print(token); sys.exit(0)
          sys.exit(1)
          PY
            fi
          }

          login_resp_file="/tmp/login_resp.json"
          login_headers_file="/tmp/login_headers.txt"
          token=""
          cookies=""

          # 1) Login with retries (capture headers + body)
          for i in 1 2 3; do
            echo "Login attempt $i..."
            http_code=$(curl -sS --max-time 20 -w "%{http_code}" -D "$login_headers_file" -o "$login_resp_file" -X POST "$LOGIN_URL" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/login_payload.json || true)
            echo "Login HTTP $http_code"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              # Try to extract token from body first
              if token_val=$(extract_token_from_body <"$login_resp_file" 2>/dev/null); then
                if [ -n "$token_val" ]; then
                  token="$token_val"
                  echo "Extracted token from body."
                  break
                fi
              fi

              # If body did not give us a token, attempt to extract from Set-Cookie headers
              cookies=$(awk 'BEGIN{ORS="; "} /^Set-Cookie:/ {sub(/^Set-Cookie: /,""); split($0,a,";"); print a[1] }' "$login_headers_file" | tr -d '\r' | sed 's/; $//')
              if [ -n "$cookies" ]; then
                echo "Found Set-Cookie header(s). Using cookies for auth."
                break
              fi

              echo "Login returned 2xx but no token or cookie was found."
            fi

            if [ "$http_code" -eq 401 ] || [ "$http_code" -eq 403 ]; then
              echo "Login unauthorized (HTTP $http_code). Check secrets."
              exit 1
            fi
            sleep 4
          done

          if [ -z "${token:-}" ] && [ -z "${cookies:-}" ]; then
            echo "Failed to get token or cookies from login."
            head -c 800 "$login_resp_file" || true
            exit 1
          fi

          # 2) GET /tasks with retries
          for i in 1 2 3; do
            echo "GET /tasks attempt $i..."
            if [ -n "${token:-}" ]; then
              http_code=$(curl -sS --max-time 20 -w "%{http_code}" -o /dev/null -X GET "$TASKS_URL" \
                -H "Accept: application/json" -H "Authorization: Bearer ${token}" || true)
            elif [ -n "${cookies:-}" ]; then
              http_code=$(curl -sS --max-time 20 -w "%{http_code}" -o /dev/null -X GET "$TASKS_URL" \
                -H "Accept: application/json" -H "Cookie: ${cookies}" || true)
            fi

            echo "Tasks HTTP $http_code"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Tasks fetch success (HTTP $http_code)."
              exit 0
            fi
            if [ "$http_code" -eq 401 ] || [ "$http_code" -eq 403 ]; then
              echo "Tasks request unauthorized (HTTP $http_code)."
              exit 1
            fi
            sleep 4
          done

          echo "Failed to fetch tasks after retries."
          exit 1
